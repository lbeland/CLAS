Description: Data sink that measures per-packet latency and throughput and logs the statistics.
Input port:
  - name: in
    type: AnyType
    slots: 1-256
    description:

Options:
  - name: n_messages
    type: int
    default: -1
    description: Number of packets to receive before stopping. -1 = infinite.
  - name: window_size
    type: int
    default: 2000
    description: Number of packets to skip at startup before computing latency statistics.
  - name: path
    type: string
    default: "run://"
    description: Path (server-side) where to save data.