Description: Simulates data source (sine wave)
Input port:
  - name: data
    type: IData
    slots: 1-256
    description:

Options:
  - name: n_messages
    type: int
    default: -1
    description: Number of messages to process before stopping. Set to -1 to run indefinitely.
  - name: fs
    type: double
    default: 10000.0
    description: Sampling frequency of the generated signal (Hz)
  - name: nchannels
    type: int
    default: 1
    description: Number of channels to generate
  - name: nsamples
    type: int
    default: 1
    description: Number of samples per message
  - name: f0
    type: double
    default: 10.0
    description: Frequency of the generated sine wave (Hz)
  - name: window_size
    type: int
    default: 1
    description: Number of samples to discard from latency measurements to account for Phase Estimation
  - name: output_file
    type: string
    default: Producer.csv
    description: Path to output CSV file where samples and latency measurements will be stored