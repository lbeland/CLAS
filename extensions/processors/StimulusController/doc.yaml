Description: Presents phase-locked auditory stimuli. Consumes an instantaneous-phase stream,
  schedules a pink-noise (Voss-McCartney) burst when the predicted phase reaches the target
  onset phase - optionally corrected for audio-output and auditory-ERP latency - and plays it
  through ALSA on a dedicated audio thread. Burst length can be a fixed duration or a fraction
  of the alpha cycle scaled by the shared IAF. Emits a gate stream marking active stimulus
  windows. Stops the graph after max_n_stimuli presentations.

Input port:
  - name: in
    type: MultiChannelType <double>
    slots: 1-256
    description: Instantaneous phase (rad) from an upstream PhaseEstimator. Only channel 0,
      sample 0 is used.

Output port:
  - name: out
    type: MultiChannelType <double>
    slots: 1-256
    description: Stimulus gate: 1.0 while a stimulus window is active, 0.0 otherwise.

Shared state:
  - name: iaf
    type: follower <double>
    default: 10.0
    description: Individual alpha frequency (Hz) from an upstream processor; scales the phase
      window and (in "deg" mode) the burst duration.

Methods:
  - name: set_enabled
    args: { enabled: bool }
    description: Runtime apply command to gate stimulus output on/off. Returns { enabled: <bool> }.

Options:
  - name: n_messages
    type: int
    default: -1
    description: Number of packets to receive before stopping. -1 = infinite.
  - name: max_n_stimuli
    type: int
    default: -1
    description: Maximum number of stimuli to present; the graph is stopped automatically when
      reached. -1 = infinite.
  - name: stim_onset_deg
    type: double
    default: 0
    description: Target stimulus onset phase in degrees.
  - name: audio_latency_s
    type: double
    default: 0
    description: Estimated audio-output latency (s), used for phase correction.
  - name: erp_latency_s
    type: double
    default: 0
    description: Estimated auditory evoked-response-potential latency (s), used for phase correction.
  - name: correct_latencies
    type: bool
    default: true
    description: Apply the audio + ERP latency corrections to stimulus timing.
  - name: stim_period_ms
    type: double
    default: 0.5
    description: Silence-period chunk size in milliseconds.
  - name: stim_amplitude
    type: double
    default: 0.7
    description: Burst amplitude (0..1).
  - name: stim_num_octaves
    type: int
    default: 16
    description: Number of Voss-McCartney octaves for the pink-noise burst.
  - name: audio_device
    type: string
    default: "hw:1,0"
    description: ALSA device string for playback (e.g. hw:1,0 or default).
  - name: audio_sample_rate
    type: int
    default: 44100
    description: Audio sample rate (Hz).
  - name: audio_channels
    type: int
    default: 2
    description: Number of audio output channels.
  - name: audio_format
    type: string
    default: "s32"
    description: Sample format - "float" (FLOAT_LE), "s16" (S16_LE) or "s32" (S32_LE).
      hw:* devices often require s16/s32.
  - name: stim_dur_unit
    type: string
    default: "deg"
    description: Burst duration unit - "deg" (fraction of alpha cycle) or "ms" (fixed).
  - name: stim_dur_deg
    type: double
    default: 90
    description: Stimulus duration in degrees (used when stim_dur_unit is "deg").
  - name: stim_dur_ms
    type: double
    default: 20
    description: Fallback burst duration in ms (used when stim_dur_unit is "ms" or the IAF is unavailable).
  - name: randomize_stim_onset
    type: bool
    default: false
    description: Randomize the stimulus onset phase on each presentation.
  - name: min_stim_dist_sec
    type: double
    default: 0
    description: Minimum spacing between consecutive stimuli (s).
  - name: max_stim_dist_sec
    type: double
    default: -1
    description: Maximum spacing between consecutive stimuli (s). -1 = no maximum.
  - name: use_background_sound
    type: bool
    default: false
    description: Play a continuous background sound underneath the stimuli.
  - name: background_dB
    type: int
    default: 18
    description: Stimulus level above the background sound (dB).
