graph:
  name: CLAS
  defaults:
    n_messages: &n_messages -1
    window_size: &window_size 50000
    fs: &fs 10000
  processors:
    SourceClient:
      class: SourceClient
      options:
        fs: *fs
        nchannels: 32
        nsamples: 1
        n_messages: *n_messages
        store_aux: true
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 6
    ChannelReductor:
      class: ChannelReductor
      options:
        n_messages: *n_messages
        default_channel_index: 1  # 1-based
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 7
    ecHTFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: [1, 1]
          low_cutoff: [5, 46]
          high_cutoff: [16, 54]
          btype: [bandpass, bandstop]
          name: ecHTfilter
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 8
    IAFEstimator:
      class: IAFEstimator
      options:
        n_messages: *n_messages
        calc_interval: 100
        window_size_sec: 10
        max_invalid_sec: 3
        # kalman_estimator_std: 0.088
        kalman_iaf_std: 0.1
        kalman_full: true
        f_min: 7.0
        f_max: 16.0
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 9
    PhaseEstimator:
      class: PhaseEstimator
      options:
        n_messages: *n_messages
        # n_fft: *window_size
        iaf_read_interval: 1
        calibrate: true
        filter:
          bandwidth: 4
        compensate_filter: true
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 10
    StimulusController:
      class: StimulusController
      options:
        stim_onset_deg: 180
        stim_dur_unit: "ms"
        stim_dur_ms: 12
        correct_latencies: true
        audio_latency_s: 0.0037
        erp_latency_s: 0
        stim_amplitude: 0.3
        stim_period_ms: 0.8
        randomize_stim_onset: false
        min_stim_dist_sec: 0.5  #
        max_stim_dist_sec: 1.2  # 300-900ms random inter-stimulus interval
      advanced:
        thread_core: 18
    Serializer(1-5):    # one serializers per output stream
      class: FileSerializer
      options:
        encoding: binary
        throttle/enabled: false
        overwrite: false
        format: full
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 1048
        thread_core: [20,21,22]
    
  connections:
  # - SourceClient.out.0 = SelectionFilter.in
  - SourceClient.out.0 = ChannelReductor.in
  # - ChannelReductor.out.0 = EstimationFilter.in
  - ChannelReductor.out.0 = ecHTFilter.in
  - ecHTFilter.out.0 = PhaseEstimator.in
  - ChannelReductor.out.0 = IAFEstimator.in
  - PhaseEstimator.out.0 = StimulusController.in

  - SourceClient.out.0 = Serializer1.in
  - SourceClient.out.1 = Serializer1.in
  - ecHTFilter.out.0 = Serializer2.in
  - PhaseEstimator.out.0 = Serializer3.in
  - PhaseEstimator.out.1 = Serializer3.in
  - IAFEstimator.out.0 = Serializer4.in
  - StimulusController.out.0 = Serializer5.in

  states:
  - IAF: [IAFEstimator.iaf, PhaseEstimator.iaf, StimulusController.iaf]
  