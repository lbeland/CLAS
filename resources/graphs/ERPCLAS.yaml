graph:
  name: CLAS
  defaults:
    n_messages: &n_messages -1
    # window_size: &window_size 50000
    fs: &fs 10000
  processors:
    UDPSource:
      class: UDPSource
      options:
        fs: *fs
        nchannels: 32
        nsamples: 1
        n_messages: *n_messages
        store_aux: true
        calib_packets: 30000
        fs_tau_s: 30
      advanced:
        buffer_sizes:
          eeg: 1024
          aux: 1024
        thread_core: 6
    ChannelReduction:
      class: ChannelReduction
      options:
        n_messages: *n_messages
        default_channel_index: 3  # 1-based
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 7
    ecHTFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: [1, 1]
          low_cutoff: [5, 46]
          high_cutoff: [16, 54]
          btype: [bandpass, bandstop]
          name: ecHTfilter
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 8
    FrequencyEstimation:
      class: FrequencyEstimation
      options:
        n_messages: *n_messages
        calc_interval: 100
        window_size_sec: 10
        max_invalid_sec: 3
        # kalman_estimator_std: 0.088
        kalman_f0_std: 0.1
        kalman_full: true
        f_min: 7.0
        f_max: 16.0
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 9
    PhaseEstimation:
      class: PhaseEstimation
      options:
        n_messages: *n_messages
        # n_fft: *window_size
        f0_read_interval: 1
        calibrate: true
        # filter:
        #   bandwidth: 4
        compensate_filter: true
      advanced:
        buffer_sizes:
          phase: 1024
          real: 1024
        thread_core: 10
    StimControl:
      class: StimControl
      options:
        # stim_onset_deg: 180
        stim_dur_unit: "ms"
        stim_dur_ms: 12
        correct_latencies: true 
        audio_latency_s: 0.005
        erp_latency_s: 0
        stim_amplitude: 1.0
        stim_period_ms: 0.8
        randomize_stim_onset: true
        min_stim_dist_sec: 0.75
        max_stim_dist_sec: 1.35  # 750ms-1350ms random inter-stimulus interval
        max_n_stimuli: 510
      advanced:
        thread_core: [18,9]
    Serializer(1-5):    # one serializers per output stream
      class: FileSerializer
      options:
        encoding: binary
        throttle/enabled: false
        overwrite: false
        format: full
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 1048
        thread_core: [19,20,21,22]
    
  connections:
  - UDPSource.eeg.0 = ChannelReduction.in
  - ChannelReduction.out.0 = ecHTFilter.in
  - ecHTFilter.out.0 = PhaseEstimation.in
  - ChannelReduction.out.0 = FrequencyEstimation.in
  - PhaseEstimation.phase.0 = StimControl.in
  - UDPSource.eeg.0 = Serializer1.in
  - UDPSource.aux.0 = Serializer1.in
  - ecHTFilter.out.0 = Serializer2.in
  - PhaseEstimation.phase.0 = Serializer3.in
  - PhaseEstimation.real.0 = Serializer3.in
  - FrequencyEstimation.out.0 = Serializer4.in
  - StimControl.out.0 = Serializer5.in

  states:
  - F0:
      permission: none
      states: [FrequencyEstimation.f0, PhaseEstimation.f0, StimControl.f0]
  
