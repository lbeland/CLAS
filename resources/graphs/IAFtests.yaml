graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 100000
    window_size: &window_size 50000
    fs: &fs 10000
  processors:
    Producer:
      class: Producer
      options:
        fs: *fs
        nchannels: 1
        nsamples: 1
        n_messages: *n_messages
        carrier_amplitude: 3.0
        carrier_frequency: 10.0
        modulation_type: "phase"
        modulation_amplitude: 1.0
        modulation_frequency: 0.05
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 7
    IAFEstimator:
      class: IAFEstimator
      options:
        n_messages: *n_messages
        calc_interval: 1000
        window_size_sec: 5
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 6
    Consumer:   # Only for measurement of latency/throughput
      class: Consumer
      options:
        n_messages: *n_messages
        window_size: *window_size
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        thread_core: 9
    Serializer(1-2):    # one serializer per output stream
      class: FileSerializer
      options:
        path: /home/linda/Documents/CLAS/rt_c_results
        encoding: binary
        throttle/enabled: false
        overwrite: true 
        format: compact
        n_messages: *n_messages
  connections:
  - Producer.out.0 = IAFEstimator.in
  - IAFEstimator.out.0 = Consumer.in

  - Producer.out.0 = Serializer1.in
  - Producer.out.1 = Serializer1.in
  - Producer.out.2 = Serializer1.in
  - Producer.out.3 = Serializer1.in
  - IAFEstimator.out.0 = Serializer2.in

  # states:
  # - IAF: [IAFEstimator.iaf, PhaseEstimator.iaf]
