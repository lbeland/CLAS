graph:
  name: CLAS
  defaults:
    n_messages: &n_messages -1
    window_size: &window_size 50000
    fs: &fs 10000
  processors:
    SourceClient:
      class: ReplaySourceClient
      options:
        fs: *fs
        path: iafInterrupt_20260616_115736/  # replay from this run in _last_run_group or results
        nchannels: 32
        nsamples: 1
        n_messages: *n_messages
        speed_factor: 1
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 6
    SelectionFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: [1, 4]
          low_cutoff: [7, 30]
          high_cutoff: [18, 70]
          btype: [bandpass, bandstop]
          name: selection
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 7
    ChannelSelector:
      class: ChannelSelector
      options:
        n_messages: *n_messages
        channel_indices: [1]   # 1-based indices of channels to select
        rms_threshold_uv: 7000
      advanced:
        buffer_sizes:
          ch_idx_out: 256
        thread_core: 8
    ChannelReductor:
      class: ChannelReductor
      options:
        n_messages: *n_messages
        default_channel_index: 1  # 1-based
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 9
    ecHTFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: [1, 1]
          low_cutoff: [5, 46]
          high_cutoff: [20, 54]
          btype: [bandpass, bandstop]
          name: ecHTfilter
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 10
    IAFEstimator:
      class: IAFEstimator
      options:
        n_messages: *n_messages
        calc_interval: 100
        window_size_sec: 10
        max_invalid_sec: 3
        # kalman_estimator_std: 0.088
        kalman_iaf_std: 0.1
        kalman_full: true
        f_min: 7.0
        f_max: 16.0
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 18
    PhaseEstimator:
      class: PhaseEstimator
      options:
        n_messages: *n_messages
        # n_fft: *window_size
        iaf_read_interval: 1
        calibrate: true
        # filter:
        #   bandwidth: 4
        compensate_filter: true
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 19
    StimulusController:
      class: StimulusController
      options:
        n_messages: *n_messages
        stim_onset_deg: 0
        stim_dur_unit: "deg"
        stim_dur_deg: 90
        correct_latencies: false
        audio_latency_s: 0.003
        erp_latency_s: 0
        stim_dur_ms: 45
        stim_amplitude: 1.0
        stim_period_ms: 1.0
        audio_device: "hw:1,0"
        use_background_sound: true
        background_dB: 30
      advanced:
        buffer_sizes:
          out: 1048
        thread_core: 20
    Consumer:   # Only for measurement of latency/throughput
      class: Consumer
      options:
        n_messages: *n_messages
        window_size: *window_size
      advanced:
        thread_core: 7
    Serializer(1-5):    # one serializers per output stream
      class: FileSerializer
      options:
        encoding: binary
        throttle/enabled: false
        overwrite: false 
        format: full
        n_messages: *n_messages
      advanced:
        thread_core: [21,22,23]
    
  connections:
  # - Producer.out.0 = SelectionFilter.in
  - SourceClient.out.0 = SelectionFilter.in
  - SourceClient.out.0 = ChannelReductor.in
  - SelectionFilter.out.0 = ChannelSelector.in
  - ChannelReductor.out.0 = ecHTFilter.in
  - ecHTFilter.out.0 = PhaseEstimator.in
  - ChannelReductor.out.0 = IAFEstimator.in
  - PhaseEstimator.out.0 = StimulusController.in
  - StimulusController.out.0 = Consumer.in

  - SourceClient.out.0 = Serializer1.in
  # - SourceClient.out.1 = Serializer1.in
  - ecHTFilter.out.0 = Serializer2.in
  - PhaseEstimator.out.0 = Serializer3.in
  - PhaseEstimator.out.1 = Serializer3.in
  - IAFEstimator.out.0 = Serializer4.in
  - ChannelSelector.ch_idx_out.0 = Serializer4.in
  - StimulusController.out.0 = Serializer5.in

  states:
  - IAF: [IAFEstimator.iaf, PhaseEstimator.iaf, StimulusController.iaf]
  - CH_IDX: [ChannelSelector.ch_idx, ChannelReductor.ch_idx]
