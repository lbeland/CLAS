graph:
  name: CLAS
  defaults:
    n_messages: &n_messages -1
    window_size: &window_size 50000
    fs: &fs 10000
  processors:
    ReplaySource:
      class: ReplaySource
      options:
        fs: *fs
        path: CLAS_linda/linda_0_p1_20260825_165924/  # replay from this run in _last_run_group or results
        nchannels: 32
        nsamples: 1
        n_messages: *n_messages
        real_time: false
        speed_factor: 1
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 6
    SelectionFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: [1, 4]
          low_cutoff: [7, 30]
          high_cutoff: [18, 70]
          btype: [bandpass, bandstop]
          name: selection
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 7
    ChannelSelection:
      class: ChannelSelection
      options:
        n_messages: *n_messages
        channel_indices: [3]   # 1-based indices of channels to select
        rms_threshold_uv: 7000
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 8
    ChannelReduction:
      class: ChannelReduction
      options:
        n_messages: *n_messages
        default_channel_index: 3  # 1-based
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 9
    # ecHTFilter:
    #   class: MultiChannelFilter
    #   options:
    #     filter:
    #       # file: filters://2_2.0_20.0_10000.txt
    #       N: [1, 1]
    #       low_cutoff: [5, 46]
    #       high_cutoff: [16, 54]
    #       btype: [bandpass, bandstop]
    #       name: ecHTfilter
    #     n_messages: *n_messages
    #   advanced:
    #     buffer_sizes:
    #       out: 256
    #     thread_core: 10
    FrequencyEstimation:
      class: FrequencyEstimation
      options:
        n_messages: *n_messages
        calc_interval: 100
        window_size_sec: 10
        max_invalid_sec: 3
        # kalman_estimator_std: 0.088
        kalman_f0_std: 0.1
        kalman_full: false
        f_min: 7.0
        f_max: 16.0
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 18
    PhaseEstimation:
      class: PhaseEstimation
      options:
        n_messages: *n_messages
        # n_fft: *window_size
        f0_read_interval: 1
        calibrate: true
        # filter:
        #   bandwidth: 4
        compensate_filter: false
      advanced:
        buffer_sizes:
          phase: 1024
          real: 1024
        thread_core: 19
    StimControl:
      class: StimControl
      options:
        n_messages: *n_messages
        stim_onset_deg: 240 # pre-peak 330°, post-peak 60°, pretrough 150°, post-trough 240°,
        stim_dur_unit: "ms"
        # stim_dur_deg: 90
        stim_dur_ms: 20 
        correct_latencies: true
        audio_latency_s: 0.005
        erp_latency_s: 0.0 #728  ######
        stim_amplitude: 1.0
        stim_period_ms: 0.8
        use_background_sound: false
        background_dB: 18
      advanced:
        buffer_sizes:
          out: 1048
        thread_core: 20
    BenchSink:   # Only for measurement of latency/throughput
      class: BenchSink
      options:
        n_messages: *n_messages
        window_size: *window_size
      advanced:
        thread_core: 7
    Serializer(1-5):    # one serializers per output stream
      class: FileSerializer
      options:
        encoding: binary
        throttle/enabled: false
        overwrite: false 
        format: full
        n_messages: *n_messages
      advanced:
        thread_core: [21,22,23]
    
  connections:
  # - SimulatedSource.data.0 = SelectionFilter.in
  - ReplaySource.out.0 = SelectionFilter.in
  - ReplaySource.out.0 = ChannelReduction.in
  - SelectionFilter.out.0 = ChannelSelection.in
  # - ChannelReduction.out.0 = ecHTFilter.in
  - ChannelReduction.out.0 = PhaseEstimation.in
  # - ecHTFilter.out.0 = PhaseEstimation.in
  - ChannelReduction.out.0 = FrequencyEstimation.in
  - PhaseEstimation.phase.0 = StimControl.in
  - StimControl.out.0 = BenchSink.in

  - ReplaySource.out.0 = Serializer1.in
  # - ReplaySource.out.1 = Serializer1.in
  # - ecHTFilter.out.0 = Serializer2.in
  - PhaseEstimation.phase.0 = Serializer3.in
  - PhaseEstimation.real.0 = Serializer3.in
  - FrequencyEstimation.out.0 = Serializer4.in
  - FrequencyEstimation.out.0 = Serializer2.in
  - ChannelSelection.out.0 = Serializer4.in
  - StimControl.out.0 = Serializer5.in

  states:
  - F0:
      permission: none
      states: [FrequencyEstimation.f0, PhaseEstimation.f0, StimControl.f0]
  - CH_IDX:
      permission: none
      states: [ChannelSelection.ch_idx, ChannelReduction.ch_idx]
