graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 5000
    window_size: &window_size 2000
  processors:
    Producer:
      class: Producer
      options:
        fs: 10000
        nchannels: 1
        nsamples: 1
        n_messages: *n_messages
        window_size: *window_size
        f0: 10
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        buffer_sizes:
          out: 16
        thread_core: 7
    BandpassFilter:
      class: MultiChannelFilter
      options:
        filter: 
          # file: filters://butter_lpf_0.1fs.filter
          low_cutoff: 2
          high_cutoff: 20
          N: 2
        n_messages: *n_messages
      # advanced:
        # thread_core: 4
    IAFEstimator:
      class: IAFEstimator
      options:
        n_messages: *n_messages
        n_fft: 131072
    PhaseEstimator:
      class: PhaseEstimator
      options:
        n_messages: *n_messages
        n_fft: *n_fft
        calibrate: true
        # coeff_file: filters://echt_coefficients.txt
        filter:
          bandwith: 4
          length: *window_size
      advanced:
        buffer_sizes:
          out: 16
        thread_core: 8
    Consumer:
      class: Consumer
      options:
        n_messages: *n_messages
        window_size: *window_size
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        thread_core: 9
  connections:
  - Producer.out.0 = Consumer.in.0
  - Producer.out.0 = BandpassFilter.in.0
  - BandpassFilter.out.0 = IAFEstimator.in.0
  - BandpassFilter.out.0 = PhaseEstimator.in.0
  - PhaseEstimator.out.0 = Consumer.in.1
  - PhaseEstimator.out.1 = Consumer.in.2
  states:
  - IAF:
      permission: write
      description: Shared individual alpha frequency between IAFEstimator and PhaseEstimator
      states:
      - IAFEstimator.iaf
      - PhaseEstimator.iaf

