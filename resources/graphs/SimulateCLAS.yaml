graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 100000
    window_size: &window_size 100000
    fs: &fs 10000
    threadpriority: &threadpriority 100
  processors:
    SimulatedSource:
      class: SimulatedSource
      options:
        fs: *fs
        nchannels: 40
        nsamples: 1
        n_messages: *n_messages
        carrier_amplitude: 3
        carrier_frequency: 10.334
        modulation_type: "phase"
        modulation_amplitude: 5
        modulation_frequency: 0.05
      advanced:
        buffer_sizes:
          data: 1024
          meta: 1024
        thread_core: 6
        threadpriority: *threadpriority
    SelectionFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: [1, 4]
          low_cutoff: [7, 40]
          high_cutoff: [16, 60]
          btype: [bandpass, bandstop]
          name: selection
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 7
        threadpriority: *threadpriority
    ChannelSelection:
      class: ChannelSelection
      options:
        n_messages: *n_messages
        channel_indices: [1,2]   # 1-based indices of channels to select
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 8
        threadpriority: *threadpriority
    ChannelReduction:
      class: ChannelReduction
      options:
        n_messages: *n_messages
        default_channel_index: 1  # 1-based
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 9
        threadpriority: *threadpriority
    ecHTFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: [1, 1]
          low_cutoff: [5, 46]
          high_cutoff: [15, 54]
          btype: [bandpass, bandstop]
          name: ecHTfilter
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 10
        threadpriority: *threadpriority
    FrequencyEstimation:
      class: FrequencyEstimation
      options:
        n_messages: *n_messages
        calc_interval: 100
        window_size_sec: 10
        max_invalid_sec: 3
        kalman_f0_std: 0.1
        kalman_full: true
        f_min: 7.0
        f_max: 16.0
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 18
        threadpriority: *threadpriority
    PhaseEstimation:
      class: PhaseEstimation
      options:
        n_messages: *n_messages
        # n_fft: *window_size
        f0_read_interval: 1
        calibrate: true
        compensate_filter: true
      advanced:
        buffer_sizes:
          phase: 1024
          real: 1024
        thread_core: 19
        threadpriority: *threadpriority
    StimControl:
      class: StimControl
      options:
        n_messages: *n_messages
        stim_onset_deg: 0
        stim_dur_unit: "ms"
        stim_dur_deg: 45
        stim_dur_ms: 20
        correct_latencies: false
        audio_latency_s: 0.0 #0.004
        erp_latency_s: 0
        stim_period_ms: 1
        stim_amplitude: 0.5
        use_background_sound: false
        background_dB: 18
      advanced:
        buffer_sizes:
          out: 1024
        thread_core: 20
    Serializer(1-5):    # one serializers per output stream
      class: FileSerializer
      options:
        encoding: binary
        throttle/enabled: false
        overwrite: false 
        format: FULL
        n_messages: *n_messages
      advanced:
        thread_core: [21,22]
  connections:
  - SimulatedSource.data.0 = SelectionFilter.in
  - SimulatedSource.data.0 = ChannelReduction.in
  - SelectionFilter.out.0 = ChannelSelection.in
  - ChannelReduction.out.0 = ecHTFilter.in
  - ecHTFilter.out.0 = PhaseEstimation.in
  - ChannelReduction.out.0 = FrequencyEstimation.in
  - PhaseEstimation.phase.0 = StimControl.in
  # - StimControl.out.0 = BenchSink.in

  - SimulatedSource.data = Serializer1.in
  - SimulatedSource.meta = Serializer1.in
  - ecHTFilter.out.0 = Serializer2.in
  - PhaseEstimation.phase.0 = Serializer3.in
  - PhaseEstimation.real.0 = Serializer3.in
  - FrequencyEstimation.out.0 = Serializer4.in
  - ChannelSelection.out.0 = Serializer4.in
  - StimControl.out.0 = Serializer5.in

  states:
  - F0: [FrequencyEstimation.f0, PhaseEstimation.f0, StimControl.f0]
  - CH_IDX: [ChannelSelection.ch_idx, ChannelReduction.ch_idx]

