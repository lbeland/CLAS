graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 25000
    window_size: &window_size 2000
    fs: &fs 10000
  processors:
    Producer:
      class: Producer
      options:
        fs: *fs
        nchannels: 1
        nsamples: 1
        n_messages: *n_messages
        carrier_amplitude: 3.0
        carrier_frequency: 7.5
        modulation_type: "phase"
        modulation_amplitude: 0
        modulation_frequency: 0.1
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 7
    # BandpassFilter:
    #   class: MultiChannelFilter
    #   options:
    #     filter:
    #       # file: filters://2_2.0_20.0_10000.txt
    #       N: 1
    #       low_cutoff: 2.5
    #       high_cutoff: 35
    #     n_messages: *n_messages
    #   advanced:
    #     buffer_sizes:
    #       out: 32
    #     thread_core: 4
    ChannelSelector:
      class: ChannelSelector
      options:
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 12
    IAFEstimator:
      class: IAFEstimator
      options:
        n_messages: *n_messages
        calc_interval: 1
        window_size_sec: 2
        f_min: 5.0
        f_max: 18.0
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 6
    PhaseEstimator:
      class: PhaseEstimator
      options:
        n_messages: *n_messages
        # n_fft: *window_size
        iaf_read_interval: 1
        calibrate: true
        filter:
          bandwith: 4
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 8
    Consumer:   # Only for measurement of latency/throughput
      class: Consumer
      options:
        n_messages: *n_messages
        window_size: *window_size
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        thread_core: 9
    Serializer(1-3):    # one serializers per output stream
      class: FileSerializer
      options:
        path: /home/linda/Documents/CLAS/rt_c_results
        encoding: binary
        throttle/enabled: false
        overwrite: true 
        format: compact
  connections:
  # - Producer.out.0 = BandpassFilter.in
  - Producer.out.0 = ChannelSelector.in
  - ChannelSelector.out.0 = IAFEstimator.in
  - ChannelSelector.out.0 = PhaseEstimator.in
  - PhaseEstimator.out.0 = Consumer.in


  - Producer.out.0 = Serializer1.in
  - Producer.out.1 = Serializer1.in
  - Producer.out.2 = Serializer1.in
  - Producer.out.3 = Serializer1.in
  - PhaseEstimator.out.0 = Serializer2.in
  - PhaseEstimator.out.1 = Serializer2.in
  - IAFEstimator.out.0 = Serializer3.in

  states:
  - IAF: [IAFEstimator.iaf, PhaseEstimator.iaf]

