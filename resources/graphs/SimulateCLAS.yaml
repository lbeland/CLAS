graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 10000
  processors:
    Producer:
      class: Producer
      options:
        fs: 10000
        nchannels: 10
        nsamples: 1
        n_messages: *n_messages
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        buffer_sizes:
          out: 16
        thread_core: 7
    PhaseEstimator:
      class: PhaseEstimator
      options:
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 16
        thread_core: 8
    Consumer:
      class: Consumer
      options:
        n_messages: *n_messages
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        thread_core: 9
  connections:
  - Producer.out.0 = Consumer.in.0
  - Producer.out.0 = PhaseEstimator.in.0
  - PhaseEstimator.out.0 = Consumer.in.1
  - PhaseEstimator.out.1 = Consumer.in.2

