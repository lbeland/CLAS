graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 300000
    window_size: &window_size 100000
    fs: &fs 10000
    threadpriority: &threadpriority 100
  processors:
    Producer:
      class: Producer
      options:
        fs: *fs
        nchannels: 40
        nsamples: 1
        n_messages: *n_messages
        carrier_amplitude: 3
        carrier_frequency: 11.34
        modulation_type: "none"
        modulation_amplitude: 0.8
        modulation_frequency: 0.0165
      advanced:
        buffer_sizes:
          out: 256
          meta_out: 256
        thread_core: 6
        threadpriority: *threadpriority
    SelectionFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: [1, 1]
          low_cutoff: [5, 46]
          high_cutoff: [18, 54]
          btype: [bandpass, bandstop]
          name: selection
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 7
        threadpriority: *threadpriority
    ChannelSelector:
      class: ChannelSelector
      options:
        n_messages: *n_messages
        channel_indices: [1,2]   # 1-based indices of channels to select
      advanced:
        buffer_sizes:
          ch_idx_out: 256
        thread_core: 8
        threadpriority: *threadpriority
    ChannelReductor:
      class: ChannelReductor
      options:
        n_messages: *n_messages
        default_channel_index: 1  # 1-based
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 9
        threadpriority: *threadpriority
    ecHTFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: [1, 1]
          low_cutoff: [5, 46]
          high_cutoff: [15, 54]
          btype: [bandpass, bandstop]
          name: ecHTfilter
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 10
        threadpriority: *threadpriority
    IAFEstimator:
      class: IAFEstimator
      options:
        n_messages: *n_messages
        calc_interval: 100
        window_size_sec: 10
        max_invalid_sec: 3
        # kalman_estimator_std: 0.088
        kalman_iaf_std: 0.4
        kalman_full: true
        f_min: 5.0
        f_max: 16.0
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 18
        threadpriority: *threadpriority
    PhaseEstimator:
      class: PhaseEstimator
      options:
        n_messages: *n_messages
        # n_fft: *window_size
        iaf_read_interval: 1
        calibrate: true
        filter:
          bandwidth: 4
        compensate_filter: true
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 19
        threadpriority: *threadpriority
    StimulusController:
      class: StimulusController
      options:
        n_messages: *n_messages
        stim_onset_deg: 0
        stim_dur_unit: "deg"
        stim_dur_deg: 90
        audio_latency_s: 0.0 #0.04
        erp_latency_s: 0
        stim_dur_ms: 25
        stim_amplitude: 0.5
      advanced:
        buffer_sizes:
          out: 256
        thread_core: 20
    Serializer(1-5):    # one serializers per output stream
      class: FileSerializer
      options:
        encoding: binary
        throttle/enabled: false
        overwrite: false 
        format: FULL
        n_messages: *n_messages
      advanced:
        thread_core: [21,22,23]
  connections:
  - Producer.out.0 = SelectionFilter.in
  - Producer.out.0 = ChannelReductor.in
  - SelectionFilter.out.0 = ChannelSelector.in
  - ChannelReductor.out.0 = ecHTFilter.in
  - ecHTFilter.out.0 = PhaseEstimator.in
  - ChannelReductor.out.0 = IAFEstimator.in
  - PhaseEstimator.out.0 = StimulusController.in
  # - StimulusController.out.0 = Consumer.in

  - Producer.out = Serializer1.in
  - Producer.meta_out = Serializer1.in
  - ecHTFilter.out.0 = Serializer2.in
  - PhaseEstimator.out.0 = Serializer3.in
  - PhaseEstimator.out.1 = Serializer3.in
  - IAFEstimator.out.0 = Serializer4.in
  - ChannelSelector.ch_idx_out.0 = Serializer4.in
  - StimulusController.out.0 = Serializer5.in

  states:
  - IAF: [IAFEstimator.iaf, PhaseEstimator.iaf, StimulusController.iaf]
  - CH_IDX: [ChannelSelector.ch_idx, ChannelReductor.ch_idx]

