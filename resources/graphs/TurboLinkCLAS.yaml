graph:
  name: CLAS
  defaults:
    n_messages: &n_messages -1
    window_size: &window_size 2000
    fs: &fs 10000
  processors:
    SourceClient:
      class: SourceClient
      options:
        fs: *fs
        nchannels: 10
        nsamples: 1
        n_messages: *n_messages
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 7
    BandpassFilter:
      class: MultiChannelFilter
      options:
        filter:
          # file: filters://2_2.0_20.0_10000.txt
          N: 1
          low_cutoff: 2.5
          high_cutoff: 35
        n_messages: *n_messages
      advanced:
        thread_core: 4
    ChannelSelector:
      class: ChannelSelector
      options:
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 12
    IAFEstimator:
      class: IAFEstimator
      options:
        n_messages: *n_messages
        calc_interval: 50
        n_fft: 10000 #131072   # 2^{17} for 10kHz sampling rate to get 0.0767Hz frequency resolution
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 6
    PhaseEstimator:
      class: PhaseEstimator
      options:
        n_messages: *n_messages
        # n_fft: *window_size
        iaf_read_interval: 50
        calibrate: true
        filter:
          bandwith: 4
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 8
    Consumer:   # Only for measurement of latency/throughput
      class: Consumer
      options:
        n_messages: *n_messages
        window_size: *window_size
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        thread_core: 9
    Serializer(1-4):    # one serializer per output stream
      class: FileSerializer
      options:
        path: /home/linda/Documents/CLAS/rt_c_results
        encoding: binary
        throttle/enabled: false
        overwrite: true 
        format: compact
        n_messages: *n_messages
    ZMQSerializer:
      class: ZMQSerializer
      options:
        interleave: true
        n_messages: *n_messages
        serialization_rate_hz: 100.0
  connections:
  - SourceClient.out.0 = BandpassFilter.in.0
  - BandpassFilter.out.0 = ChannelSelector.in

  - ChannelSelector.out.0 = IAFEstimator.in
  - ChannelSelector.out.0 = PhaseEstimator.in
  - PhaseEstimator.out.0 = Consumer.in

  - SourceClient.out.0 = Serializer1.in
  - BandpassFilter.out.0 = Serializer2.in
  - PhaseEstimator.out.0 = Serializer3.in
  - PhaseEstimator.out.1 = Serializer3.in
  - IAFEstimator.out.0 = Serializer4.in

  - ChannelSelector.out.0 = ZMQSerializer.in.0
  - PhaseEstimator.out.0 = ZMQSerializer.in.1
  states:
  - IAF: [IAFEstimator.iaf, PhaseEstimator.iaf]
