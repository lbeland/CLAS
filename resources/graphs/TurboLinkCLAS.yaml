graph:
  name: CLAS
  defaults:
    n_messages: &n_messages -1
    # window_size: &window_size 50000
    fs: &fs 10000
    use_stim_protocol: true
  processors:
    SourceClient:
      class: SourceClient
      options:
        fs: *fs
        # nchannels: 32          # default
        # nsamples: 1
        # n_messages: *n_messages  # default
        # store_aux: true        # default
        calib_packets: 30000
        fs_tau_s: 30
      advanced:
        buffer_sizes:
          out: 2048
        thread_core: [6,18]
    SelectionFilter:
      class: MultiChannelFilter
      options:
        filter:
          N: [1, 4]
          low_cutoff: [7, 30]
          high_cutoff: [18, 70]
          btype: [bandpass, bandstop]
          name: selection
        # n_messages: *n_messages  # default
      advanced:
        buffer_sizes:
          out: 2048
        thread_core: [7,19]
    ChannelSelector:
      class: ChannelSelector
      options:
        # n_messages: *n_messages  # default
        channel_indices: [3]   # 1-based indices of channels to select
        rms_threshold_uv: 20
      advanced:
        buffer_sizes:
          ch_idx_out: 2048
        thread_core: [7,19]
    ChannelReductor:
      class: ChannelReductor
      options:
        # n_messages: *n_messages  # default
        default_channel_index: 3  # 1-based
      advanced:
        buffer_sizes:
          out: 2048
        thread_core: [7,19]
    ecHTFilter:
      class: MultiChannelFilter
      options:
        filter:
          N: [1, 1]
          low_cutoff: [5, 46]
          high_cutoff: [16, 54]
          btype: [bandpass, bandstop]
          name: ecHTfilter
        # n_messages: *n_messages  # default
      advanced:
        buffer_sizes:
          out: 2048
        thread_core: [7,19]
    IAFEstimator:
      class: IAFEstimator
      options:
        # n_messages: *n_messages  # default
        # calc_interval: 100      # default
        window_size_sec: 10
        max_invalid_sec: 3
        kalman_iaf_std: 0.1
        # kalman_full: true       # default
        f_min: 7.0
        f_max: 16.0
      advanced:
        buffer_sizes:
          out: 2048
        thread_core: [11,23]
    PhaseEstimator:
      class: PhaseEstimator
      options:
        # n_messages: *n_messages  # default
        # n_fft: *window_size
        iaf_read_interval: 1
        calibrate: true
        # compensate_filter: true  # default
      advanced:
        buffer_sizes:
          out: 2048
        thread_core: [9,21]
    StimulusController:
      class: StimulusController
      options:
        # n_messages: *n_messages  # default
        stim_onset_deg: 330        #### TODO ####### pre-peak 330°, post-peak 60°, pre-trough 150°, post-trough 240°,
        stim_dur_unit: "ms"
        # stim_dur_deg: 90
        # stim_dur_ms: 20         # default
        # correct_latencies: true  # default
        audio_latency_s: 0.005
        erp_latency_s: 0.0 #631   ###### TODO #########
        stim_amplitude: 1.0
        stim_period_ms: 0.8
        # use_background_sound: false  # default
        # background_dB: 18       # default
      advanced:
        buffer_sizes:
          out: 2048
        thread_core: [10,22,5,17]
    Serializer(1-5):    # one serializers per output stream
      class: FileSerializer
      #options:
        # encoding: binary        # default
        # throttle/enabled: false # default
        # overwrite: false        # default
        # format: full            # default
        # n_messages: *n_messages  # default
      advanced:
        thread_core: [8,20]
  connections:
  - SourceClient.out.0 = SelectionFilter.in
  - SourceClient.out.0 = ChannelReductor.in
  - SelectionFilter.out.0 = ChannelSelector.in
  - ChannelReductor.out.0 = ecHTFilter.in
  - ecHTFilter.out.0 = PhaseEstimator.in
  - ChannelReductor.out.0 = IAFEstimator.in
  - PhaseEstimator.out.0 = StimulusController.in

  - SourceClient.out.0 = Serializer1.in
  - SourceClient.out.1 = Serializer1.in
  - ecHTFilter.out.0 = Serializer2.in
  - PhaseEstimator.out.0 = Serializer3.in
  - PhaseEstimator.out.1 = Serializer3.in
  - IAFEstimator.out.0 = Serializer4.in
  - ChannelSelector.ch_idx_out.0 = Serializer4.in
  - StimulusController.out.0 = Serializer5.in

  states:
  - IAF: [IAFEstimator.iaf, PhaseEstimator.iaf, StimulusController.iaf]
  - CH_IDX: [ChannelSelector.ch_idx, ChannelReductor.ch_idx]


