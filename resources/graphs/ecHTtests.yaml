graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 20000
    window_size: &window_size 200
    fs: &fs 1000
  processors:
    Producer:
      class: Producer
      options:
        fs: *fs
        nchannels: 1
        nsamples: 1
        n_messages: *n_messages
        carrier_amplitude: 3.0
        carrier_frequency: 10.0
        modulation_type: "phase"
        modulation_amplitude: 0.5
        modulation_frequency: 0.025
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 7
    PhaseEstimator:
      class: PhaseEstimator
      options:
        n_messages: *n_messages
        # n_fft: *window_size
        iaf_read_interval: 1
        calibrate: true
        filter:
          bandwith: 4
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 8
    Consumer:   # Only for measurement of latency/throughput
      class: Consumer
      options:
        n_messages: *n_messages
        window_size: *window_size
        output_file: /home/linda/Documents/CLAS/rt_c_results/10_1
      advanced:
        thread_core: 9
    Serializer(1-2):    # one serializer per output stream
      class: FileSerializer
      options:
        path: /home/linda/Documents/CLAS/rt_c_results
        encoding: binary
        throttle/enabled: false
        overwrite: true 
        format: compact
        n_messages: *n_messages
  connections:
  - Producer.out.0 = PhaseEstimator.in
  - PhaseEstimator.out.0 = Consumer.in

  - Producer.out.0 = Serializer1.in
  - Producer.out.1 = Serializer1.in
  - Producer.out.2 = Serializer1.in
  - Producer.out.3 = Serializer1.in
  - PhaseEstimator.out.0 = Serializer2.in
  - PhaseEstimator.out.1 = Serializer2.in

  states:
  - IAF: [Producer.iaf, PhaseEstimator.iaf]
