graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 6000000
    fs: &fs 10000
  processors:
    SimulatedSource:
      class: SimulatedSource
      options:
        fs: *fs
        nchannels: 1
        n_messages: *n_messages
        inter_packet_sleep: false
        # noise_seed: 42
        carrier_amplitude: 1
        carrier_frequency: 10.0
        modulation_type: "none"
        # modulation_amplitude: 1      # default
        modulation_frequency: 0.2
        mod_period_s: 3.13
        # phase_jump_angle: 3.14159265358979  # default
        freq_step_size: -2
        chirp_slope: 1.0
        # noise_color: "white"        # default
        snr_db: 100.0
        # noise_band_hz: 4.0          # default
        # burst_on_s: 1.0             # default
        # burst_off_s: 0.0            # default
      advanced:
        buffer_sizes:
          data: 2
        thread_core: 7
    ecHTFilter:
      class: MultiChannelFilter
      options:
        filter:
          N: [1, 1]
          low_cutoff: [5, 46]
          high_cutoff: [16, 54]
          btype: [bandpass, bandstop]
          name: ecHTfilter
        n_messages: *n_messages
      advanced:
        buffer_sizes:
          out: 2
        thread_core: 10
    PhaseEstimation:
      class: PhaseEstimation
      options:
        n_messages: *n_messages
        f0_read_interval: 1
        calibrate: true
        # compensate_filter: true  # default
      advanced:
        buffer_sizes:
          phase: 32
          real: 32
        thread_core: 8
    Serializer(1-3):    # one serializer per output stream
      class: FileSerializer
      options:
        n_messages: *n_messages
  connections:
  - SimulatedSource.data.0 = ecHTFilter.in
  - ecHTFilter.out.0 = PhaseEstimation.in
  # - SimulatedSource.data.0 = PhaseEstimation.in
  - SimulatedSource.data.0 = Serializer1.in
  - SimulatedSource.meta.0 = Serializer1.in   # ground truth: [amplitude, theta, inst_freq], NaN while burst-off
  - PhaseEstimation.phase.0 = Serializer2.in
  - PhaseEstimation.real.0 = Serializer2.in
  - ecHTFilter.out.0 = Serializer3.in

  states:
  - F0:
      permission: none
      states: [SimulatedSource.f0, PhaseEstimation.f0]
