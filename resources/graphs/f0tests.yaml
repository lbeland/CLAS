graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 500000
    fs: &fs 10000
  processors:
    SimulatedSource:
      class: SimulatedSource
      options:
        fs: *fs
        nchannels: 1
        nsamples: 1
        n_messages: *n_messages
        inter_packet_sleep: false
        carrier_amplitude: 3.0
        carrier_frequency: 10.0
        # Signal mode (mutually exclusive):
        #   none | amplitude | phase | phase_jump | freq_step | chirp
        modulation_type: "none"
        modulation_amplitude: 2      # amplitude/phase: modulation depth
        modulation_frequency: 0.1    # amplitude/phase: modulation rate (Hz)
        mod_period_s: 10.0            # phase_jump/freq_step: unperturbed segment length (s)
        phase_jump_angle: 3.14159265358979  # phase_jump: jump angle (rad)
        freq_step_size: -2          # freq_step: frequency offset while toggled (Hz)
        chirp_slope: 0.2             # chirp: linear frequency slope (Hz/s)
        # Imperfections applied to every mode:
        noise_color: "pink"        # white | pink (Voss-McCartney 1/f)
        snr_db: 50.0                 # in-band SNR (dB): carrier power vs noise power in noise_band_hz
        noise_band_hz: 8.0          # width of the SNR reference band around carrier_frequency (Hz)
        burst_on_s: 1.0              # bursty signal: ON duration (s)
        burst_off_s: 0.0             # bursty signal: OFF duration (s); 0 = always on
      advanced:
        buffer_sizes:
          data: 32
        thread_core: 7
    FrequencyEstimation:
      class: FrequencyEstimation
      options:
        n_messages: *n_messages
        calc_interval: 100
        window_size_sec: 10
        max_invalid_sec: 3
        kalman_f0_std: 0.1
        f_min: 7.0
        f_max: 16.0
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 6
    Serializer(1-2):    # one serializer per output stream
      class: FileSerializer
      options:
        n_messages: *n_messages
  connections:
  - SimulatedSource.data.0 = FrequencyEstimation.in

  - SimulatedSource.data.0 = Serializer1.in
  - SimulatedSource.meta.0 = Serializer1.in   # ground truth: [amplitude, theta, inst_freq], NaN while burst-off

  - FrequencyEstimation.out.0 = Serializer2.in

