graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 1500000
    fs: &fs 10000
  processors:
    SimulatedSource:
      class: SimulatedSource
      options:
        fs: *fs
        nchannels: 1
        n_messages: *n_messages
        inter_packet_sleep: false
        carrier_amplitude: 3.0
        carrier_frequency: 4.0
        modulation_type: "chirp"
        modulation_amplitude: 2
        # modulation_frequency: 0.1    # default
        mod_period_s: 10.0
        # phase_jump_angle: 3.14159265358979  # default
        freq_step_size: -2
        chirp_slope: 0.1
        # noise_color: "white"        # default
        # snr_db: 20.0                 # default
        # noise_band_hz: 4.0          # default
        # burst_on_s: 1.0              # default
        # burst_off_s: 0.0             # default
      advanced:
        buffer_sizes:
          data: 32
        thread_core: 7
    FrequencyEstimation:
      class: FrequencyEstimation
      options:
        n_messages: *n_messages
        # calc_interval: 100  # default
        window_size_sec: 10
        max_invalid_sec: 3
        kalman_f0_std: 0.1
        f_min: 7.0
        f_max: 16.0
        debug_output: true
      advanced:
        buffer_sizes:
          out: 32
        thread_core: 6
    Serializer(1-2):    # one serializer per output stream
      class: FileSerializer
      options:
        n_messages: *n_messages
  connections:
  - SimulatedSource.data.0 = FrequencyEstimation.in

  - SimulatedSource.data.0 = Serializer1.in
  - SimulatedSource.meta.0 = Serializer1.in   # ground truth: [amplitude, theta, inst_freq], NaN while burst-off

  - FrequencyEstimation.out.0 = Serializer2.in  # kalman smoothed f0 estimate
  - FrequencyEstimation.out.1 = Serializer2.in  # raw peak f0 (pre-Kalman), debug_output=true

