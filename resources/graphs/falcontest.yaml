graph:
  name: CLAS
  defaults:
    n_messages: &n_messages 100000
    window_size: &window_size 0
    fs: &fs 10000
  processors:
    Producer:
      class: Producer
      options:
        fs: *fs
        nchannels: 40
        nsamples: 1
        n_messages: *n_messages
        carrier_amplitude: 3
        carrier_frequency: 8.34
        modulation_type: "phase"
        modulation_amplitude: 0.8
        modulation_frequency: 0.033
      advanced:
        # buffer_sizes:
        #   out: 32
        thread_core: 6
        threadpriority: 100
    Consumer1:   # Only for measurement of latency/throughput
      class: Consumer
      options:
        n_messages: *n_messages
        window_size: *window_size
      advanced:
        threadpriority: 50
        thread_core: 7
    Consumer2:   # Only for measurement of latency/throughput
      class: Consumer
      options:
        n_messages: *n_messages
        window_size: *window_size
      advanced:
        threadpriority: 50
        thread_core: 8
  connections:
  - Producer.out = Consumer1.in
  - Producer.meta_out = Consumer2.in


